name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + format + build + test + copy-guard)
        run: pnpm verify

      - name: Advisory snapshot staleness (warn only)
        run: node scripts/check-advisories-fresh.mjs

      - name: Site smoke (serve dist/, HTTP 200 + theme var parity)
        run: bash packages/site/scripts/smoke-site.sh
