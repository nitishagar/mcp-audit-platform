name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + format + build + test + copy-guard)
        run: pnpm verify

      - name: Site smoke (serve dist/, HTTP 200 + theme var parity)
        run: bash packages/site/scripts/smoke-site.sh
