name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + format + build + test + copy-guard)
        run: pnpm verify

      - name: Advisory snapshot staleness (warn only)
        run: node scripts/check-advisories-fresh.mjs

      - name: Site smoke (serve dist/, HTTP 200 + theme var parity)
        run: bash packages/site/scripts/smoke-site.sh
