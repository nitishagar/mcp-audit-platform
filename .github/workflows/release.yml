name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: pnpm/action-setup@fe02b34f5dbd9a59fb7cd6e1a33d0fd1a6fbdc2d # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --access public
        working-directory: packages/scanner
      - name: Live npx smoke of the published package
        run: npx --yes mcp-audit-scanner@${GITHUB_REF_NAME#v} --help | grep -q "static MCP"
      - name: GitHub Release with the audit schema
        run: |
          gh release create "$GITHUB_REF_NAME" packages/scanner/audit.schema.json \
            --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
