name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ba4d7f769990 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
