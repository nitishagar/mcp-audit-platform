name: Bug report
description: Something in the scanner, site, or action does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command you ran and the output (redact any secrets — the scanner withholds values, do the same here).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-audit version
      placeholder: 0.1.0
    validations:
      required: true
