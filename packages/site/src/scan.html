<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan in your browser · mcp-audit</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tokens.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
</head>
<body>
<nav><a href="index.html">← mcp-audit</a></nav>
<main>
  <h1>Scan in your browser — nothing leaves this page</h1>
  <p class="muted">The scanner runs entirely in this tab. There is no network call: no upload, no telemetry, no account. View-source or DevTools → Network shows zero requests after load.</p>
  <p><label for="file">Pick a config file</label> <input type="file" id="file" accept=".json,application/json"> or paste it:</p>
  <textarea id="input" rows="12" cols="80" placeholder='{"mcpServers": { … }} or {"servers": [ … ]}'></textarea>
  <p><button type="button" id="scan-btn">Scan (static analysis only — not a pentest)</button></p>
  <div id="output" hidden>
    <h2>Result</h2>
    <p id="counts" class="muted"></p>
    <pre id="summary"></pre>
    <p>
      <button type="button" id="download-audit">Download audit.json</button>
      · <button type="button" id="download-report">Download report.html</button>
    </p>
    <p class="muted" id="gate"></p>
  </div>
</main>
<script type="module" src="scan-ui.js"></script>
</body>
</html>
